<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link id="favicon-link" rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover lets the page draw under the iOS notch/home-
         indicator and Android gesture-nav areas instead of leaving them
         a plain black bar; components that sit at the true edges (see
         env(safe-area-inset-*) in src/styles/native.css) pad themselves
         clear of those areas explicitly. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta id="theme-color-meta" name="theme-color" content="#07060a" />
    <!-- Lets someone add perennia.org to their home screen (iOS "Add to
         Home Screen", Android's install prompt) and have it open full-
         screen like a native app, still served from the same site —
         no separate app store build. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Perennia" />
    <!-- PNG: Safari ignores SVG touch icons (public/static/icon-*.png are the favicon rendered at each size). -->
    <link rel="apple-touch-icon" sizes="180x180" href="/static/icon-180.png" />
    <!-- seo:head — replaced per request by the backend (app/seo_render.py)
         with each page's own title, description, canonical, hreflang,
         share tags and structured data, in the page's language. What's
         here is only the fallback for `npm run dev`; src/seo/pageMeta.js
         keeps these tags in step as visitors move between pages. -->
    <title>AI &amp; Custom Software Development Company in Kuwait | Perennia</title>
    <meta id="meta-description" name="description" content="Perennia is a Kuwait-based AI and software development company: custom software, AI implementation and IT strategy for businesses in Kuwait and the GCC." />
    <link rel="canonical" href="https://perennia.org/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Perennia" />
    <meta property="og:title" content="AI &amp; Custom Software Development Company in Kuwait | Perennia" />
    <meta property="og:description" content="Perennia is a Kuwait-based AI and software development company: custom software, AI implementation and IT strategy for businesses in Kuwait and the GCC." />
    <meta property="og:url" content="https://perennia.org/" />
    <meta property="og:image" content="https://perennia.org/static/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AI &amp; Custom Software Development Company in Kuwait | Perennia" />
    <meta name="twitter:description" content="Perennia is a Kuwait-based AI and software development company: custom software, AI implementation and IT strategy for businesses in Kuwait and the GCC." />
    <meta name="twitter:image" content="https://perennia.org/static/og-image.png" />
    <!-- /seo:head -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      id="google-fonts-link"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Syne:wght@500;600;700;800&family=Noto+Kufi+Arabic:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- seo:body — the page's own content, rendered by the backend so
         every crawler sees it without running JavaScript; React replaces
         it with the same content when it starts. -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
